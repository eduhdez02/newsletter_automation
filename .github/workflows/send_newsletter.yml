name: Send DAUCH Newsletter

on:
  schedule:
    # 1 y 16 del mes a las 15:00 UTC (09:00 UTC-6) — envío real (--full)
    - cron: '0 15 1,16 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de ejecución"
        required: true
        default: "test"
        type: choice
        options:
          - dry-run
          - test
          - full

permissions:
  contents: write

jobs:
  build-send-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # El cron programado siempre envía en modo --full (lista real de
      # destinatarios). Las corridas manuales (workflow_dispatch) usan el
      # modo elegido en la UI de Actions, "test" por default para nunca
      # mandar de más por accidente.
      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=--full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=--${{ github.event.inputs.mode || 'test' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate and send newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          RECEIVERS: ${{ secrets.RECEIVERS }}
          TEST_RECIPIENT: ${{ secrets.TEST_RECIPIENT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python run_newsletter.py ${{ steps.mode.outputs.mode }}

      # keep_files: true — a diferencia del workflow anterior, esto NO
      # borra las ediciones pasadas en gh-pages (antes se perdía el
      # historial en cada corrida).
      - name: Deploy newsletter to GitHub Pages
        if: steps.mode.outputs.mode != '--dry-run'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: output/newsletters
          keep_files: true
